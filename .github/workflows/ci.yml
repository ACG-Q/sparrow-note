name: CI

# 一个文件跑完四种事，靠触发器 + if 分流：
#
#   推 main / 开 PR   → web（类型 / lint / 测试 / 覆盖率）+ rust（cargo test + check）
#   推 v* tag         → 桌面三平台 + iOS + 安卓，全部打包并挂到同一个 GitHub Release
#   手动 Run workflow → 三端都打包，但只出 artifact，不发版（想只要某个包时也一样跑，
#                      各 job 并行，谁先好谁的 artifact 先能下）
#
# 需要的 secrets（都不配也能跑，会退化）：
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#     → 有就出已签名 APK，没有就出 debug APK
#   IOS_CERTIFICATE / IOS_CERTIFICATE_PASSWORD / IOS_MOBILE_PROVISION
#     → 有就出可安装 IPA，没有就出未签名 IPA
on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "review/**"
      - "**/*.md"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "review/**"
      - "**/*.md"
      - ".gitignore"
  workflow_dispatch:

# 同一 ref 上新的推送取消上一轮（tag 发版不取消，避免发一半）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write

env:
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------- 质量门禁
  web:
    name: 前端 · 类型 / lint / 测试 / 覆盖率
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npx tsc --noEmit

      - name: Lint（oxlint）
        run: npm run lint

      - name: 单元测试
        run: npx vitest run

      - name: 覆盖率（记录用，不设阈值卡合并）
        run: npm run coverage

      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  rust:
    name: Rust · 构建与单元测试
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 装 Tauri 的 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: 单元测试
        working-directory: src-tauri
        run: cargo test --lib

      - name: 桌面端能编译
        working-directory: src-tauri
        run: cargo check --all-targets

  # ---------------------------------------------------------------- 桌面
  desktop:
    name: 桌面 · ${{ matrix.label }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            slug: windows-x64
            os: windows-latest
            args: ""
            rustTargets: ""
            # 产物目录（CI 日志里确认过的真实路径前缀）
            bundleDir: src-tauri/target/release/bundle
          - label: macOS Apple Silicon
            slug: macos-arm64
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            rustTargets: "aarch64-apple-darwin"
            bundleDir: src-tauri/target/aarch64-apple-darwin/release/bundle
          - label: Linux x64
            slug: linux-x64
            os: ubuntu-22.04
            args: ""
            rustTargets: ""
            bundleDir: src-tauri/target/release/bundle
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.label }}

      - name: 装 Tauri 的 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npx tsc --noEmit

      # 只打包，不碰 Release：所有上传都集中在最后的 publish job，一处说了算
      - name: 打包
        uses: tauri-apps/tauri-action@action-v1.0.0
        with:
          args: ${{ matrix.args }}

      # 按各平台真实的产物子目录取文件（upload-artifact 的通配符在 Linux/macOS 上一个都没匹配到，
      # 三个平台的包装不出来就是这个原因）：
      #   Windows: <bundle>/nsis/*.exe、<bundle>/msi/*.msi
      #   macOS:   <bundle>/dmg/*.dmg（macos/*.app.tar.gz 是更新器产物，不发）
      #   Linux:   <bundle>/deb/*.deb、<bundle>/rpm/*.rpm、<bundle>/appimage/*.AppImage
      # 按平台真实的产物子目录取文件；不再用 find/通配叠加，避免把 target 里的
      # 构建中间产物（build-script-build.exe 之类）一起收进来。
      #   Windows: <bundle>/nsis/*-setup.exe（有的话再加 msi）
      #   macOS:   <bundle>/dmg/*.dmg
      #   Linux:   <bundle>/deb/*.deb、<bundle>/rpm/*.rpm、<bundle>/appimage/*.AppImage
      # 按平台真实的产物子目录取文件。
      # 两个坑都踩过：
      #   1) macOS runner 是 bash 3.2，set -u 下展开空数组 "${files[@]}" 会报 unbound variable；
      #   2) 相对路径在不同步骤的 cwd 下不保证一致，统一用 $GITHUB_WORKSPACE 拼绝对路径。
      - name: 收集安装包
        shell: bash
        run: |
          set -uo pipefail
          rm -rf out
          mkdir -p out
          B="$GITHUB_WORKSPACE/${{ matrix.bundleDir }}"
          echo "bundleDir=[$B]"
          echo "--- 目录概览 ---"
          ls -R "$B" 2>&1 | head -80 || true

          for dir in nsis msi dmg deb rpm appimage; do
            echo "--- 尝试 $B/$dir ---"
            found=0
            shopt -s nullglob
            for f in "$B"/$dir/*; do
              case "$f" in
                *.exe|*.msi|*.dmg|*.deb|*.rpm|*.AppImage)
                  if cp -v -- "$f" out/; then found=$((found + 1)); fi
                  ;;
              esac
            done
            shopt -u nullglob
            echo "收集到 $found 个"
          done

          echo "---- out ----"
          ls -lh out || true
          n=$(ls -1 out 2>/dev/null | wc -l | tr -d " ")
          echo "文件数：$n"

      - name: 上传安装包（供 publish 汇总）
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.slug }}
          path: out/**
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------- iOS
  # 有证书 → ad-hoc IPA（可直接安装）；没证书 → 未签名 IPA（越狱机或重签工具用）。
  # 未签名 IPA 的本质就是 Payload/<App>.app 压成 zip。
  ios:
    name: iOS · IPA
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ios

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 生成 iOS 工程（gen/apple 不入库，每次现生成）
        run: npx tauri ios init

      # 插件依赖走 CocoaPods（每个 tauri 插件都带 podspec），之后才有 .xcworkspace 可用。
      # macos 镜像不一定预装 pod，缺就现装。
      - name: 装 CocoaPods
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            gem install cocoapods --no-document
          fi
          pod --version

      - name: 安装 Pod 依赖
        shell: bash
        # 不当作致命错误：init 里可能已经装过；真缺依赖时下一步 xcodebuild 会报出来
        continue-on-error: true
        run: |
          set -uxo pipefail
          cd src-tauri/gen/apple
          if [ -f Podfile ]; then
            pod install || pod install --repo-update || true
          else
            echo "没有 Podfile，跳过"
          fi

      - name: 不签名 IPA
        if: env.IOS_CERTIFICATE == ''
        shell: bash
        run: |
          set -euxo pipefail
          cd src-tauri/gen/apple

          if ls -d *.xcworkspace >/dev/null 2>&1; then
            W="$(ls -d *.xcworkspace | head -1)"; TARGET_ARGS="-workspace $W"
            LIST="$(xcodebuild -list -workspace "$W" 2>/dev/null || true)"; DEFAULT="${W%.xcworkspace}"
          else
            P="$(ls -d *.xcodeproj | head -1)"; TARGET_ARGS="-project $P"
            LIST="$(xcodebuild -list -project "$P" 2>/dev/null || true)"; DEFAULT="${P%.xcodeproj}"
          fi
          SCHEME="$(printf '%s\n' "$LIST" | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')"
          SCHEME="${SCHEME:-$DEFAULT}"
          echo "scheme=$SCHEME"

          xcodebuild $TARGET_ARGS -scheme "$SCHEME" -configuration release -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            build | tail -n 80

          ls -d build/Build/Products/*/*.app 2>/dev/null || true
          APP="$(ls -d build/Build/Products/Release-iphoneos/*.app 2>/dev/null | head -1 || true)"
          if [ -z "${APP:-}" ]; then
            echo "::error::xcodebuild 没产出 .app（上面 80 行是构建日志）"
            exit 1
          fi
          OUT="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/"
          VER="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          ( cd "$OUT" && zip -qry "sparrow-note-${VER}-ios-unsigned.ipa" Payload )
          rm -rf "$OUT/Payload"
          ls -lh "$OUT"

      - name: 已签名 IPA
        if: env.IOS_CERTIFICATE != ''
        run: |
          npx tauri ios build --export-method ad-hoc
          mkdir -p dist
          find src-tauri/gen/apple -name "*.ipa" -exec cp {} dist/ \;
          cd dist && for f in *.ipa; do mv "$f" "sparrow-note-${GITHUB_REF_NAME#v}-$f"; done
          ls -lh dist

      - name: 上传 IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: dist/*.ipa
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------- 安卓
  android:
    name: 安卓 · 通用 APK
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: android

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # 缺 SDK 组件时由 Gradle 自己下（AGP 默认允许）
      - name: 接受 Android 许可
        run: yes | sdkmanager --licenses > /dev/null || true

      # gen/android 不入库，构建前必须先 init
      - name: 生成安卓工程
        run: npx tauri android init

      - name: 打 release APK
        if: env.KS_B64 != ''
        run: npx tauri android build --apk

      - name: 用 keystore 签名
        if: env.KS_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          mkdir -p dist
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          shopt -s nullglob
          for apk in src-tauri/gen/android/app/build/outputs/apk/*/release/*-unsigned.apk; do
            name="$(basename "$apk" -unsigned.apk)"; abi="${name#app-}"; abi="${abi%-release}"
            out="$PWD/dist/sparrow-note-${GITHUB_REF_NAME#v}-${abi}.apk"
            "$BT/zipalign" -p -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
              --out "$out" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify "$out"
          done

      - name: 没配密钥时改用调试包
        if: env.KS_B64 == ''
        shell: bash
        run: |
          set -euo pipefail
          npx tauri android build --apk --debug
          mkdir -p dist
          cp src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk \
            "dist/sparrow-note-${GITHUB_REF_NAME#v}-android-debug.apk"

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------- 挂到 Release
  # 桌面包由 tauri-action 自己传；移动端两个包在这里合并上传，避免几个 job 抢着建 Release
  # ---------------------------------------------------------------- 发布
  # 唯一的「上传」入口：把三个平台 + iOS + 安卓的产物全下载下来，一次性发到同一个 Release。
  # 这样 Release 的名字、说明、prerelease 判断只有一处，也不会有几个 job 抢着建 Release。
  publish:
    name: 发布 · 汇总所有安装包
    # 用 always()：某个端挂了也把已经打好的包发出去，总比一个 Release 都没有强
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, ios, android]
    runs-on: ubuntu-latest
    steps:
      - name: 下载桌面安装包
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: assets
          merge-multiple: true

      - name: 下载 iOS 包
        # iOS 构建失败时这个 artifact 不存在，不能让整个发布跟着塌
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ios-ipa
          path: assets

      - name: 下载安卓包
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: assets

      - name: 清点产物
        run: |
          find assets -type f | sort
          n=$(find assets -type f | wc -l)
          echo "文件数：$n"
          if [ "$n" -eq 0 ]; then
            echo "::error::一个安装包都没打出来，不发 Release"
            exit 1
          fi
          if ! ls assets/*.ipa >/dev/null 2>&1; then
            echo "::warning::没有 iOS 包（iOS job 失败或没配签名），这次 Release 只有桌面/安卓"
          fi

      - name: 发到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 麻雀记 ${{ github.ref_name }}
          body: |
            桌面端、安卓、iOS 安装包都在下方 Assets。

            - Windows：`*_x64-setup.exe`
            - macOS：`*.dmg`（Apple Silicon）
            - Linux：`*.AppImage` / `*.deb`
            - 安卓：`*-universal.apk`（有密钥时已签名；没有则是 `-debug` 包）
            - iOS：`*-ios-unsigned.ipa`（未签名，需用 AltStore / Sideloadly 重签后才能装）

            装好后打开「我的 → 关于 → 检查更新」就能收到新版本。
          files: assets/**
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          fail_on_unmatched_files: true
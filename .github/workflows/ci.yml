name: CI

# 一个文件跑完三件事：
#   推 main / PR   → web（tsc / oxlint / vitest / 覆盖率）+ rust（cargo test / check）
#   推 v* tag       → 桌面三平台 + 安卓 + iOS 打包 → publish 汇总发一个 Release
#   手动 Run workflow → 三端打包，只出 artifact（不发版）
#
# 设计要点（都是踩过坑之后定的）：
#   1. 桌面包交给 tauri-action 自己上传 artifact（uploadWorkflowArtifacts），
#      不再自己去 src-tauri/target 里找文件——构建目录在下一步已经不存在了；
#   2. publish 是唯一出口：下载全部 artifact，按扩展名筛出安装包，一次性发 Release；
#   3. 打包 job 之间不互相等待，只有 publish 等它们全部结束。
on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore: ["docs/**", "review/**", "**/*.md", ".gitignore"]
  pull_request:
    paths-ignore: ["docs/**", "review/**", "**/*.md", ".gitignore"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write

env:
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------- 质量门禁
  web:
    name: 前端 · 类型 / lint / 测试 / 覆盖率
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run
      - run: npm run coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  rust:
    name: Rust · 构建与单元测试
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: 装 Tauri 的 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf
      - working-directory: src-tauri
        run: cargo test --lib
      - working-directory: src-tauri
        run: cargo check --all-targets

  # ---------------------------------------------------------------- 桌面
  # tauri-action 负责构建 + 把安装包上传成 artifact（名字形如 windows-x64-nsis），
  # 我们不再碰 src-tauri/target。
  desktop:
    name: 桌面 · ${{ matrix.label }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            args: ""
            rustTargets: ""
          - label: macOS Apple Silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            rustTargets: "aarch64-apple-darwin"
          - label: Linux x64
            os: ubuntu-22.04
            args: ""
            rustTargets: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.label }}
      - name: 装 Tauri 的 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit

      - name: 打包（安装包由 tauri-action 自己上传成 artifact）
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true

  # ---------------------------------------------------------------- 安卓
  android:
    name: 安卓 · 通用 APK
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: android
      - run: npm ci --no-audit --no-fund
      - name: 接受 Android 许可
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: 生成安卓工程
        run: npx tauri android init
      - name: 打 release APK
        if: env.KS_B64 != ''
        run: npx tauri android build --apk
      - name: 用 keystore 签名
        if: env.KS_B64 != ''
        shell: bash
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          mkdir -p dist
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          shopt -s nullglob
          for apk in src-tauri/gen/android/app/build/outputs/apk/*/release/*-unsigned.apk; do
            name="$(basename "$apk" -unsigned.apk)"; abi="${name#app-}"; abi="${abi%-release}"
            out="$PWD/dist/sparrow-note-${GITHUB_REF_NAME#v}-${abi}.apk"
            "$BT/zipalign" -p -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
              --out "$out" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify "$out"
          done
      - name: 没配密钥时改用调试包
        if: env.KS_B64 == ''
        shell: bash
        run: |
          set -euo pipefail
          npx tauri android build --apk --debug
          mkdir -p dist
          cp src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk \
            "dist/sparrow-note-${GITHUB_REF_NAME#v}-android-debug.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------- iOS
  # 没配证书就出未签名 IPA（越狱机 / AltStore / Sideloadly 重签后可用）；
  # 配了证书走 tauri ios build 的 ad-hoc 导出。失败不挡桌面与安卓发版。
  ios:
    name: iOS · IPA
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ios
      - run: npm ci --no-audit --no-fund
      - name: 生成 iOS 工程
        run: npx tauri ios init
      - name: 装 CocoaPods
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v pod >/dev/null 2>&1; then gem install cocoapods --no-document; fi
          pod --version
      - name: 安装 Pod 依赖
        continue-on-error: true
        shell: bash
        run: |
          set -uxo pipefail
          cd src-tauri/gen/apple
          if [ -f Podfile ]; then pod install || pod install --repo-update || true; fi
      - name: 有证书 → ad-hoc 导出 IPA
        if: env.IOS_CERTIFICATE != ''
        run: |
          npx tauri ios build --export-method ad-hoc
          mkdir -p dist
          find src-tauri/gen/apple -name "*.ipa" -exec cp {} dist/ \;
      - name: 没证书 → 未签名 IPA（Payload/<App>.app 打包）
        if: env.IOS_CERTIFICATE == ''
        shell: bash
        run: |
          set -euxo pipefail
          B="$(ls -d src-tauri/gen/apple/*.xcworkspace 2>/dev/null | head -1 || true)"
          if [ -n "$B" ]; then
            TARGET_ARGS="-workspace $B"
            LIST="$(xcodebuild -list -workspace "$B" 2>/dev/null || true)"
          else
            P="$(ls -d src-tauri/gen/apple/*.xcodeproj | head -1)"
            TARGET_ARGS="-project $P"
            LIST="$(xcodebuild -list -project "$P" 2>/dev/null || true)"
          fi
          SCHEME="$(printf '%s\n' "$LIST" | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')"
          echo "scheme=$SCHEME"
          xcodebuild $TARGET_ARGS -scheme "$SCHEME" -configuration release -sdk iphoneos \
            -derivedDataPath "$PWD/ios-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            build | tail -n 80
          APP="$(ls -d ios-build/Build/Products/Release-iphoneos/*.app | head -1)"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          VER="$(node -p "require('./package.json').version")"
          ( cd dist && zip -qry "sparrow-note-${VER}-ios-unsigned.ipa" Payload )
          rm -rf dist/Payload
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-ipa
          path: dist/*.ipa
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------- 发布
  # 唯一出口：把三个平台 + 安卓 + iOS 的产物收齐，按扩展名筛，一次性发 Release。
  publish:
    name: 发布 · 汇总所有安装包
    # 某个端挂了也把已经打好的包发出去，总比一个 Release 都没有强
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, ios, android]
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部 artifact
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: assets
          merge-multiple: true

      - name: 筛出安装包
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p dist
          find assets -type f \
            \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" \
               -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.ipa" \) \
            -exec cp -v -- {} dist/ \; 2>/dev/null || true
          echo "---- dist ----"
          ls -lh dist || true
          n=$(ls -1 dist 2>/dev/null | wc -l | tr -d " ")
          echo "文件数：$n"
          if [ "$n" -eq 0 ]; then
            echo "::error::一个安装包都没收集到，不发 Release"
            exit 1
          fi

      - name: 发到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 麻雀记 ${{ github.ref_name }}
          body: |
            桌面端、安卓、iOS 安装包都在下方 Assets。

            - Windows：`*_x64-setup.exe`
            - macOS：`*.dmg`（Apple Silicon）
            - Linux：`*.AppImage` / `*.deb` / `*.rpm`
            - 安卓：`*.apk`（有 keystore 时已签名，否则是 `-debug` 包）
            - iOS：`*-ios-unsigned.ipa`（未签名，需 AltStore / Sideloadly 重签后安装）

            装好后打开「我的 → 关于 → 检查更新」就能收到新版本。
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          fail_on_unmatched_files: false

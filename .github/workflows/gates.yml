name: 质量门禁

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: 单元测试
        run: npx vitest run

      - name: 覆盖率（全源码口径，不设阈值阻止合并，只做记录）
        run: npm run coverage

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

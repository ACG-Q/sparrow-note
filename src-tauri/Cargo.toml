[package]
name = "sparrow-note"
version = "0.1.0"
description = "麻雀记 - 日记与生活记录"
edition = "2024"
rust-version = "1.90"

[lib]
name = "sparrow_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-mcp-bridge = "0.13"

[package]
name = "sparrow-note"
version = "0.1.0"
description = "麻雀记 - 日记与生活记录"
edition = "2024"
rust-version = "1.90"

[lib]
name = "sparrow_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-geolocation = "2"
# 移动端导出：dialog 出系统「另存为」，fs 把字节真正写到用户选的位置。
# Android WebView 不认 `<a download>`，blob 下载既不落盘也不报错。
# 版本写死，保证解析到的就是下面 vendor 目录里那份（否则 [patch] 会变成 unused）。
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-fs = "=2.7.1"
# 自己写的：安卓上选数据目录（plugin-dialog 在移动端不支持目录选择器）
tauri-plugin-sparrow-storage = { path = "plugins/tauri-plugin-sparrow-storage" }

# MCP bridge 只用于桌面调试：它引用了 WebviewWindow::minimize / maximize，
# 这两个方法在安卓上没有，编译会直接报错。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-mcp-bridge = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# 规避本机 MSVC D8050：-Z7 嵌入调试信息触发 cl 的 debug records 写入机制，
# 在 cargo build script 上下文中该机制对此机必定失败（release 无 -Z7 则正常）。
[profile.dev]
debug = false

# 火绒会拦「编译脚本往 cargo 缓存里写」：这几个插件的 build.rs 都要在包目录里
# 写 permissions/、android/.tauri 之类的文件，而 cargo 把依赖源码放在 %USERPROFILE%\.cargo，
# HIPS 直接拒写。把插件放进项目里编译，写入就发生在项目目录内。
[patch.crates-io]
tauri-plugin-geolocation = { path = "vendor/tauri-plugin-geolocation" }
tauri-plugin-notification = { path = "vendor/tauri-plugin-notification" }
tauri-plugin-dialog = { path = "vendor/tauri-plugin-dialog" }
tauri-plugin-fs = { path = "vendor/tauri-plugin-fs" }
